<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bingo Control Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace'],
            },
            colors: {
              coral: {
                50: '#eff6ff',
                100: '#dbeafe',
                200: '#bfdbfe',
                300: '#93c5fd',
                400: '#60a5fa',
                500: '#3b82f6',
                600: '#2563eb',
                700: '#1d4ed8',
              },
              brand: {
                navy: '#1e40af',
                emerald: '#059669',
                dark: '#0b0f19',
                muted: '#64748b',
              },
              surface: {
                DEFAULT: '#0b0f19',
                container: {
                  DEFAULT: '#131b2e',
                  low: '#0e1526',
                  high: '#162032',
                  lowest: '#0b0f19',
                },
              },
              on: {
                surface: { DEFAULT: '#f1f5f9', variant: '#94a3b8' },
              },
            },
            boxShadow: {
              soft: '0 4px 15px rgba(0, 0, 0, 0.3)',
              card: '0 4px 20px rgba(0, 0, 0, 0.25)',
              glow: '0 0 20px rgba(59, 130, 246, 0.3)',
            },
          }
        }
      }
    </script>
  </head>
  <body class="bg-[#0b0f19] text-slate-100 font-sans antialiased selection:bg-blue-500/30 selection:text-blue-200">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
